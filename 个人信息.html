<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - Ming工具箱</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 480px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        h1 { font-size: 22px; font-weight: 600; cursor: pointer; }
        .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; min-height: 80px; cursor: pointer; }
        .card-title { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
        .card-desc { font-size: 12px; color: var(--text-sub); }
    </style>
</head>
<body>
<div class="container">
    <header><h1 onclick="location.href='index.html'">‹ 个人信息</h1></header>
    <div class="grid-cards" id="profile-cards-container"></div>
</div>
<script>
    let db = JSON.parse(localStorage.getItem('ming_toolbox_data')) || {
        profiles: [
            { id: 'height', title: '身高', value: '168', updateTime: '2026年10月19日' },
            { id: 'weight', title: '体重', value: '105斤', updateTime: '2026年10月19日' }
        ]
    };
    function saveDB() { localStorage.setItem('ming_toolbox_data', JSON.stringify(db)); }

    function initProfileModule() {
        const container = document.getElementById('profile-cards-container');
        let html = '';
        db.profiles.forEach(p => {
            html += `
                <div class="card" data-profile-key="${p.id}">
                    <div>
                        <div class="card-title">${p.title}</div>
                        <div style="font-size: 20px; font-weight: 600; margin: 10px 0;">${p.value}</div>
                        <div class="card-desc">更新于 ${p.updateTime}</div>
                    </div>
                </div>`;
        });
        html += `<div class="card" id="add-profile-trigger" style="border: 2px dashed var(--card-border); align-items: center; justify-content: center;"><div style="text-align:center; color: var(--text-sub);">+ 添加信息</div></div>`;
        container.innerHTML = html;
    }

    document.body.onclick = e => {
        const pCard = e.target.closest('[data-profile-key]');
        if(pCard) {
            const profile = db.profiles.find(p => p.id === pCard.getAttribute('data-profile-key'));
            const newVal = prompt(`修改 ${profile.title}：`, profile.value);
            if(newVal !== null) {
                profile.value = newVal;
                profile.updateTime = `${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日`;
                saveDB(); initProfileModule();
            }
        }
        if(e.target.id === 'add-profile-trigger' || e.target.closest('#add-profile-trigger')) {
            const title = prompt('请输入新信息名称（例如：视力、血压）：');
            if(title) {
                const val = prompt('请输入对应数值：');
                if(val) {
                    db.profiles.push({ id: 'custom_' + Date.now(), title, value: val, updateTime: `${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日` });
                    saveDB(); initProfileModule();
                }
            }
        }
    };

    initProfileModule();
</script>
</body>
</html>
