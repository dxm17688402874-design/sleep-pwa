<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ming工具箱</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        .container { max-width: 480px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; display: flex; flex-direction: column; padding-bottom: 90px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        h1 { font-size: 22px; font-weight: 600; cursor: pointer; }
        
        /* 首页卡片布局 */
        .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; min-height: 80px; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.08); }
        .card-title { font-size: 16px; font-weight: 500; margin-bottom: 8px; pointer-events: none; }
        .card-desc { font-size: 12px; color: var(--text-sub); pointer-events: none; }

        /* 底部浮动数据按钮 */
        .data-btn { position: fixed; right: 20px; bottom: 80px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); cursor: pointer; border: none; z-index: 100; }

        /* 底部导航栏 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 14px 0; z-index: 99; }
        .nav-item { color: var(--text-sub); font-size: 14px; text-decoration: none; cursor: pointer; background: none; border: none; padding: 6px 12px; }
        .nav-item.active { color: var(--accent); font-weight: 600; }

        /* 子页面通用 */
        .sub-page { display: none; flex-direction: column; flex: 1; }
        .sub-page.active { display: flex; }

        /* 作息星空风首页 */
        .sleep-hero { background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .sleep-planet-btn { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; color: white; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); transition: transform 0.2s; display: flex; align-items: center; justify-content: center; }
        .sleep-planet-btn:active { transform: scale(0.95); }
        .sleep-planet-btn.awake { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); }

        /* 通用表单与列表 */
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 14px; color: var(--text-sub); margin-bottom: 8px; display: block; }
        .tag-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { padding: 4px 12px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--card-border); font-size: 12px; color: var(--text-main); cursor: pointer; margin-right:10px;margin-bottom:10px;}
        .tag.selected { background: var(--accent); border-color: var(--accent); }
        .input-box { width: 100%; padding: 12px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: white; font-size: 16px; margin-bottom: 16px; outline: none; }
        
        /* 定制下拉菜单样式 */
        select.input-box {
            background-color: #121824;
            color: var(--text-main);
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
            cursor: pointer;
        }
        select.input-box option {
            background-color: #121824;
            color: var(--text-main);
            padding: 10px;
        }

        .btn-primary { width: 100%; padding: 12px; border-radius: 12px; background: var(--accent-gradient); color: white; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        /* 列表与滑动删除容器（彻底解决透出与边框外露） */
        .list-container { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
        .list-item-wrapper { position: relative; overflow: hidden; border-radius: 12px; touch-action: pan-y; margin-bottom:10px;}
        
        .delete-action { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: var(--danger); color: white; display: none; align-items: center; justify-content: center; font-size: 14px; z-index: 1; border-top-right-radius: 12px; border-bottom-right-radius: 12px; cursor: pointer; font-weight: 600; }
        
        .list-item { background-color: #121824; border: 1px solid var(--card-border); padding: 14px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; transition: transform 0.2s ease; border-radius: 12px; }
        .list-item.highlight { background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%); border-color: var(--accent); }
        
        .list-item-wrapper.swiped .list-item { transform: translateX(-80px); }
        .list-item-wrapper.swiped .delete-action { display: flex; }

        /* 月历样式 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-bottom: 16px; background: var(--card-bg); padding: 12px; border-radius: 14px; border: 1px solid var(--card-border); }
        .cal-header { font-size: 12px; color: var(--text-sub); padding-bottom: 6px; }
        .cal-day { padding: 8px 0; font-size: 14px; border-radius: 8px; cursor: pointer; color: var(--text-sub); }
        .cal-day.has-record { color: var(--text-main); font-weight: 600; background: rgba(255,255,255,0.08); }
        .cal-day.selected { background: var(--accent) !important; color: white !important; }

        /* 时段分布进度条样式 */
        .time-slot-row { margin-bottom: 12px; }
        .time-slot-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        .time-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
        .time-bar-fill { height: 100%; background: var(--accent-gradient); border-radius: 4px; transition: width 0.3s ease; }

        /* 模态框 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-content { background: #121824; border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; width: 100%; max-width: 360px; }
        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btns button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: var(--card-bg); color: var(--text-sub); }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- 主页 -->
    <div id="page-home" class="sub-page active">
        <header>
            <h1>Ming工具箱</h1>
        </header>
        <div class="grid-cards">
            <div class="card" id="card-sleep">
                <div>
                    <div class="card-title">作息记录</div>
                    <div class="card-desc">睡眠监测与时长统计</div>
                </div>
            </div>
            <div class="card" id="card-bill">
                <div>
                    <div class="card-title">账单记录</div>
                    <div class="card-desc">消费明细与智能排行</div>
                </div>
            </div>
            <div class="card" id="card-profile">
                <div>
                    <div class="card-title">个人信息</div>
                    <div class="card-desc">身高体重健康数据</div>
                </div>
            </div>
            <div class="card" style="opacity: 0.5;">
                <div>
                    <div class="card-title">预留扩展</div>
                    <div class="card-desc">敬请期待新工具</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 作息记录模块 -->
    <div id="page-sleep" class="sub-page">
        <header>
            <h1 class="nav-home">‹ 作息记录</h1>
        </header>
        <div id="sleep-content-home">
            <div class="sleep-hero">
                <button id="sleep-btn" class="sleep-planet-btn">开睡</button>
                <p id="sleep-status-text" style="margin-top: 14px; font-size: 14px; color: var(--text-sub);">点击记录您的睡眠状态</p>
            </div>
            <div class="list-container" id="sleep-today-list"></div>
        </div>
        <div id="sleep-content-history" style="display:none;">
            <div id="sleep-calendar-container"></div>
            <div class="list-container" id="sleep-history-list"></div>
        </div>
        <div id="sleep-content-stats" style="display:none;">
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <select id="sleep-stat-month-select" class="input-box" style="margin-bottom:0;margin-right:15px; flex:1;">
                    <option value="all">全年</option>
                    <option value="01">1月</option>
                    <option value="02">2月</option>
                    <option value="03">3月</option>
                    <option value="04">4月</option>
                    <option value="05">5月</option>
                    <option value="06">6月</option>
                    <option value="07">7月</option>
                    <option value="08">8月</option>
                    <option value="09">9月</option>
                    <option value="10">10月</option>
                    <option value="11">11月</option>
                    <option value="12">12月</option>
                </select>
                <select id="sleep-stat-year-select" class="input-box" style="margin-bottom:0; width: 110px;"></select>
            </div>
            <div class="card" style="margin-bottom:12px;">
                <div class="card-desc" id="sleep-stat-period-title">本月总睡眠时长</div>
                <div style="font-size:20px; font-weight:600; margin-top:6px;" id="stat-total-sleep">0小时0分钟</div>
            </div>
            <div class="card" style="margin-bottom:12px;">
                <div class="card-desc">平均每天睡眠时长</div>
                <div style="font-size:20px; font-weight:600; margin-top:6px;" id="stat-avg-sleep">0小时0分钟</div>
            </div>
            <div class="card">
                <div class="card-title" style="font-size:14px; margin-bottom:12px;">时段分布</div>
                <div id="sleep-time-bars" style="display: flex; flex-direction: column; gap: 8px;">暂无时段统计数据</div>
            </div>
        </div>
        <div class="bottom-nav">
            <button class="nav-item active" data-sleep-tab="home">首页</button>
            <button class="nav-item" data-sleep-tab="history">历史</button>
            <button class="nav-item" data-sleep-tab="stats">统计</button>
        </div>
    </div>

    <!-- 账单记录模块 -->
    <div id="page-bill" class="sub-page">
        <header>
            <h1 class="nav-home">‹ 账单记录</h1>
        </header>
        <div id="bill-content-record">
            <div class="form-group">
                <label class="form-label">品类</label>
                <div class="tag-group" id="tags-category"></div>
            </div>
            <div class="form-group">
                <label class="form-label">平台</label>
                <div class="tag-group" id="tags-platform"></div>
            </div>
            <div class="form-group">
                <label class="form-label">品名</label>
                <div class="tag-group" id="tags-item"></div>
            </div>
            <div class="form-group">
                <label class="form-label">金额 (元)</label>
                <input type="number" step="0.01" id="bill-amount" class="input-box" placeholder="0.00">
            </div>
            <button class="btn-primary" id="save-bill-btn">保存账单</button>
            <div style="margin-top: 16px; font-size: 14px; color: var(--text-sub);">今日总消费: <span id="today-total" style="color:var(--text-main); font-weight:600;">0.00</span> 元</div>
            <div style="font-size: 14px; color: var(--text-sub); margin-top: 16px; margin-bottom: 8px;">今日消费记录</div>
            <div class="list-container" id="bill-today-list"></div>
        </div>
        <div id="bill-content-history" style="display:none;">
            <div id="bill-calendar-container"></div>
            <div id="bill-day-total-banner" style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:10px; background:var(--card-bg); padding:10px 14px; border-radius:10px; border:1px solid var(--card-border);"></div>
            <div class="list-container" id="bill-history-list"></div>
        </div>
        <div id="bill-content-stats" style="display:none;">
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <select id="stat-month-select" class="input-box" style="margin-bottom:0; flex:1;">
                    <option value="all">全年</option>
                    <option value="01">1月</option>
                    <option value="02">2月</option>
                    <option value="03">3月</option>
                    <option value="04">4月</option>
                    <option value="05">5月</option>
                    <option value="06">6月</option>
                    <option value="07">7月</option>
                    <option value="08">8月</option>
                    <option value="09">9月</option>
                    <option value="10">10月</option>
                    <option value="11">11月</option>
                    <option value="12">12月</option>
                </select>
                <select id="stat-year-select" class="input-box" style="margin-bottom:0; width: 110px;"></select>
            </div>
            <div class="card" style="margin-bottom:12px;">
                <div class="card-desc" id="bill-stat-period-title">本月总消费</div>
                <div style="font-size:22px; font-weight:600; margin-top:6px;" id="bill-stat-period-total">0.00 元</div>
            </div>
            <div class="card" style="margin-bottom:12px;">
                <div class="card-desc">本日总消费 (固定显示今天)</div>
                <div style="font-size:22px; font-weight:600; margin-top:6px;" id="bill-stat-today-total">0.00 元</div>
            </div>
            <div class="card" id="bill-stat-rankings"></div>
        </div>
        <div class="bottom-nav">
            <button class="nav-item active" data-bill-tab="record">记账</button>
            <button class="nav-item" data-bill-tab="history">历史账单</button>
            <button class="nav-item" data-bill-tab="stats">统计</button>
        </div>
    </div>

    <!-- 个人信息模块 -->
    <div id="page-profile" class="sub-page">
        <header>
            <h1 class="nav-home">‹ 个人信息</h1>
        </header>
        <div class="grid-cards" id="profile-cards-container"></div>
    </div>
</div>

<!-- 数据管理悬浮按钮 -->
<button class="data-btn" id="open-data-modal">数据</button>

<!-- 数据管理弹窗 -->
<div class="modal" id="data-modal">
    <div class="modal-content">
        <div class="modal-title">数据管理</div>
        <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 16px;">支持导出全部整站数据为 JSON 文件，或导入外部备份文件（导入将完全替换当前数据）。</p>
        <button class="btn-primary" id="export-json-btn" style="margin-bottom: 10px;">导出整站数据</button>
        <button class="btn-primary" id="trigger-import-btn" style="background:var(--card-bg); border:1px solid var(--card-border);">导入整站数据</button>
        <input type="file" id="import-file" style="display:none" accept=".json">
        <div class="modal-btns" style="margin-top: 16px;">
            <button class="btn-cancel" id="close-data-modal">关闭</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        let db = JSON.parse(localStorage.getItem('ming_toolbox_data')) || {
            sleeps: [],
            bills: [],
            profiles: [
                { id: 'height', title: '身高', value: '168', updateTime: '2026年10月19日' },
                { id: 'weight', title: '体重', value: '105斤', updateTime: '2026年10月19日' }
            ],
            options: {
                category: ['衣服', '裤子', '外卖', '鸡蛋'],
                platform: ['美团', '拼多多', '京东', '抖音', '小红书'],
                item: ['青椒炒肉', '腐竹炒肉', '一碗香', '衬衫', '体恤']
            }
        };

        function saveDB() {
            localStorage.setItem('ming_toolbox_data', JSON.stringify(db));
        }

        function switchModule(modName) {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            if(modName === 'home') {
                document.getElementById('page-home').classList.add('active');
            } else if(modName === 'sleep') {
                document.getElementById('page-sleep').classList.add('active');
                switchSleepTab('home');
            } else if(modName === 'bill') {
                document.getElementById('page-bill').classList.add('active');
                switchBillTab('record');
            } else if(modName === 'profile') {
                document.getElementById('page-profile').classList.add('active');
                initProfileModule();
            }
        }

        document.getElementById('card-sleep').onclick = function() { switchModule('sleep'); };
        document.getElementById('card-bill').onclick = function() { switchModule('bill'); };
        document.getElementById('card-profile').onclick = function() { switchModule('profile'); };

        let selectedSleepDate = new Date().toISOString().split('T')[0];
        let selectedBillDate = new Date().toISOString().split('T')[0];

        function formatDuration(totalMinutes) {
            const hrs = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            return `${hrs}小时${mins}分钟`;
        }

        function formatSleepItemHTML(s, origIdx, isHighlight = false) {
            const startDate = new Date(s.start);
            const year = startDate.getFullYear();
            const month = startDate.getMonth() + 1;
            const day = startDate.getDate();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const weekday = weekdays[startDate.getDay()];

            const startTimeStr = `${startDate.getHours()}点${startDate.getMinutes()}分`;
            const endDate = new Date(s.end);
            const endTimeStr = `${endDate.getHours()}点${endDate.getMinutes()}分`;

            const durationMin = Math.round((s.end - s.start) / 60000);
            const dateStrFormatted = `${year}年${month}月${day}日    ${weekday}`;

            return `
                <div class="list-item-wrapper" data-swipe-wrapper>
                    <div class="delete-action" data-del-sleep="${origIdx}">删除</div>
                    <div class="list-item ${isHighlight ? 'highlight' : ''}">
                        <div>
                            <div style="font-size:13px; color:var(--text-main); font-weight:600;">${dateStrFormatted}</div>
                            <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">${startTimeStr}~${endTimeStr}</div>
                        </div>
                        <div style="font-size:13px; font-weight:600; color:var(--accent);">共休息${formatDuration(durationMin)}</div>
                    </div>
                </div>
            `;
        }

        function formatBillItemHTML(b, origIdx, isHighlight = false) {
            return `
                <div class="list-item-wrapper" data-swipe-wrapper>
                    <div class="delete-action" data-del-bill="${origIdx}">删除</div>
                    <div class="list-item ${isHighlight ? 'highlight' : ''}">
                        <div>
                            <div style="font-weight:600;">${b.item} <span style="font-size:12px; color:var(--text-sub); font-weight:normal;">(${b.category} / ${b.platform})</span></div>
                            <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">${b.date} ${b.time}</div>
                        </div>
                        <div style="font-weight:600; color:var(--danger);">-¥${b.amount.toFixed(2)}</div>
                    </div>
                </div>
            `;
        }

        /* 作息模块逻辑 */
        let currentSleep = JSON.parse(localStorage.getItem('ming_current_sleep')) || null;
        function initSleepModule() {
            const btn = document.getElementById('sleep-btn');
            const txt = document.getElementById('sleep-status-text');
            if(!btn) return;
            if(currentSleep) {
                btn.innerText = '醒来';
                btn.classList.add('awake');
                txt.innerText = '正在睡眠中... 开始于 ' + new Date(currentSleep.start).toLocaleTimeString();
            } else {
                btn.innerText = '开睡';
                btn.classList.remove('awake');
                txt.innerText = '点击记录您的睡眠状态';
            }
            renderTodaySleepList();
        }

        function renderTodaySleepList() {
            const container = document.getElementById('sleep-today-list');
            if(!container) return;
            const todayStr = new Date().toISOString().split('T')[0];
            const matched = db.sleeps.map((s, idx) => ({...s, origIdx: idx})).filter(s => s.dateStr === todayStr);
            if(matched.length === 0) {
                container.innerHTML = `<div style="color:var(--text-sub); font-size:13px; padding:10px 0;">今日暂无睡眠记录</div>`;
                return;
            }
            let html = '';
            matched.forEach((s, idx) => {
                const isLatest = (idx === matched.length - 1);
                html = formatSleepItemHTML(s, s.origIdx, isLatest) + html;
            });
            container.innerHTML = html;
        }

        function toggleSleep() {
            const now = new Date().getTime();
            if(!currentSleep) {
                currentSleep = { start: now };
                localStorage.setItem('ming_current_sleep', JSON.stringify(currentSleep));
            } else {
                const record = { start: currentSleep.start, end: now, dateStr: new Date(currentSleep.start).toISOString().split('T')[0] };
                db.sleeps.push(record);
                saveDB();
                currentSleep = null;
                localStorage.removeItem('ming_current_sleep');
            }
            initSleepModule();
        }

        function switchSleepTab(tab) {
            ['home', 'history', 'stats'].forEach(t => {
                const el = document.getElementById('sleep-content-' + t);
                if(el) el.style.display = (t === tab) ? 'block' : 'none';
            });
            document.querySelectorAll('#page-sleep .nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-sleep-tab') === tab);
            });
            if(tab === 'home') initSleepModule();
            if(tab === 'history') renderSleepCalendarAndList();
            if(tab === 'stats') initSleepStatsView();
        }

        function renderSleepCalendarAndList() {
            const container = document.getElementById('sleep-calendar-container');
            if(!container) return;
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let recordedDates = new Set(db.sleeps.map(s => s.dateStr));

            let html = `<div class="calendar-grid">
                <div class="cal-header">一</div><div class="cal-header">二</div><div class="cal-header">三</div><div class="cal-header">四</div><div class="cal-header">五</div><div class="cal-header">六</div><div class="cal-header">日</div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const mStr = (month + 1).toString().padStart(2, '0');
                const dStr = d.toString().padStart(2, '0');
                const dateKey = `${year}-${mStr}-${dStr}`;
                const hasRec = recordedDates.has(dateKey);
                const isSel = selectedSleepDate === dateKey;

                html += `<div class="cal-day ${hasRec ? 'has-record' : ''} ${isSel ? 'selected' : ''}" data-sleep-date="${dateKey}">${d}</div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
            renderSleepListForDate(selectedSleepDate);
        }

        function renderSleepListForDate(dateStr) {
            const listCont = document.getElementById('sleep-history-list');
            if(!listCont) return;
            const matched = db.sleeps.map((s, idx) => ({...s, origIdx: idx})).filter(s => s.dateStr === dateStr);
            if(matched.length === 0) {
                listCont.innerHTML = `<div style="color:var(--text-sub); text-align:center; padding:15px;">${dateStr} 暂无睡眠记录</div>`;
                return;
            }
            let html = '';
            matched.forEach((s, idx) => {
                const isLatest = (idx === matched.length - 1);
                html = formatSleepItemHTML(s, s.origIdx, isLatest) + html;
            });
            listCont.innerHTML = html;
        }

        function initSleepStatsView() {
            const yearSelect = document.getElementById('sleep-stat-year-select');
            const monthSelect = document.getElementById('sleep-stat-month-select');
            const currentYear = new Date().getFullYear();
            const currentMonth = (new Date().getMonth() + 1).toString().padStart(2, '0');

            let yearHtml = '';
            for(let y = currentYear; y >= currentYear - 3; y--) {
                yearHtml += `<option value="${y}">${y}年</option>`;
            }
            yearSelect.innerHTML = yearHtml;
            yearSelect.value = currentYear.toString();
            monthSelect.value = currentMonth;

            renderSleepStats();
        }

        function renderSleepStats() {
            const yearVal = document.getElementById('sleep-stat-year-select').value;
            const monthVal = document.getElementById('sleep-stat-month-select').value;

            let totalMinutes = 0;
            let slots = [0, 0, 0, 0];
            let countedDays = new Set();

            db.sleeps.forEach(s => {
                const [sYear, sMonth] = s.dateStr.split('-');
                if(sYear === yearVal) {
                    if(monthVal === 'all' || sMonth === monthVal) {
                        const dur = Math.round((s.end - s.start) / 60000);
                        totalMinutes += dur;
                        countedDays.add(s.dateStr);

                        const hour = new Date(s.start).getHours();
                        if(hour >= 0 && hour < 6) slots[0]++;
                        else if(hour >= 6 && hour < 12) slots[1]++;
                        else if(hour >= 12 && hour < 18) slots[2]++;
                        else slots[3]++;
                    }
                }
            });

            document.getElementById('sleep-stat-period-title').innerText = monthVal === 'all' ? `${yearVal}年度总睡眠时长` : `${yearVal}年${parseInt(monthVal)}月总睡眠时长`;
            document.getElementById('stat-total-sleep').innerText = formatDuration(totalMinutes);

            const daysCount = countedDays.size > 0 ? countedDays.size : 1;
            const avgMinutes = Math.round(totalMinutes / daysCount);
            document.getElementById('stat-avg-sleep').innerText = formatDuration(avgMinutes);

            const maxSlotCount = Math.max(...slots, 1);
            const slotDetails = [
                { title: '凌晨', range: '0:00-06:00', count: slots[0] },
                { title: '上午', range: '6:00-12:00', count: slots[1] },
                { title: '下午', range: '12:00-18:00', count: slots[2] },
                { title: '晚上', range: '18:00-24:00', count: slots[3] }
            ];

            let barsHtml = '';
            slotDetails.forEach(slot => {
                const percent = Math.round((slot.count / maxSlotCount) * 100);
                barsHtml += `
                    <div class="time-slot-row">
                        <div class="time-slot-info">
                            <span style="color:var(--text-main);">${slot.title}    ${slot.range}</span>
                            <span style="color:var(--accent); font-weight:600;">${slot.count}次</span>
                        </div>
                        <div class="time-bar-bg">
                            <div class="time-bar-fill" style="width: ${percent}%;"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('sleep-time-bars').innerHTML = barsHtml;
        }

        /* 账单模块逻辑 */
        let selectedTag = { category: '', platform: '', item: '' };
        function initBillModule() {
            renderTags('category');
            renderTags('platform');
            renderTags('item');
            calcTodayTotal();
            renderTodayBillList();
        }

        function getSortedOptions(type) {
            let counts = {};
            db.options[type].forEach(opt => counts[opt] = 0);
            db.bills.forEach(b => {
                if(b[type] && counts[b[type]] !== undefined) counts[b[type]]++;
            });
            return [...db.options[type]].sort((a, b) => counts[b] - counts[a]);
        }

        function renderTags(type) {
            const container = document.getElementById('tags-' + type);
            if(!container) return;
            const sortedOpts = getSortedOptions(type);
            if(!selectedTag[type] || !sortedOpts.includes(selectedTag[type])) {
                selectedTag[type] = sortedOpts[0] || '';
            }
            let html = '';
            sortedOpts.forEach((opt) => {
                const isSelected = selectedTag[type] === opt;
                html += `<div class="tag ${isSelected ? 'selected' : ''}" data-tag-type="${type}" data-tag-val="${opt}">${opt}</div>`;
            });
            html += `<div class="tag" data-add-tag="${type}">+ 添加</div>`;
            container.innerHTML = html;
        }

        function addBill() {
            const amount = parseFloat(document.getElementById('bill-amount').value);
            if(isNaN(amount) || amount <= 0) {
                alert('请输入正确的金额！');
                return;
            }
            const newBill = {
                category: selectedTag.category,
                platform: selectedTag.platform,
                item: selectedTag.item,
                amount: amount,
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString()
            };
            db.bills.push(newBill);
            saveDB();
            document.getElementById('bill-amount').value = '';
            calcTodayTotal();
            renderTodayBillList();
        }

        function calcTodayTotal() {
            const today = new Date().toISOString().split('T')[0];
            let total = 0;
            db.bills.forEach(b => { if(b.date === today) total += b.amount; });
            const el = document.getElementById('today-total');
            if(el) el.innerText = total.toFixed(2);
        }

        function renderTodayBillList() {
            const container = document.getElementById('bill-today-list');
            if(!container) return;
            const todayStr = new Date().toISOString().split('T')[0];
            const matched = db.bills.map((b, idx) => ({...b, origIdx: idx})).filter(b => b.date === todayStr);
            if(matched.length === 0) {
                container.innerHTML = `<div style="color:var(--text-sub); font-size:13px; padding:10px 0;">今日暂无消费记录</div>`;
                return;
            }
            let html = '';
            matched.forEach((b, idx) => {
                const isLatest = (idx === matched.length - 1);
                html = formatBillItemHTML(b, b.origIdx, isLatest) + html;
            });
            container.innerHTML = html;
        }

        function switchBillTab(tab) {
            ['record', 'history', 'stats'].forEach(t => {
                const el = document.getElementById('bill-content-' + t);
                if(el) el.style.display = (t === tab) ? 'block' : 'none';
            });
            document.querySelectorAll('#page-bill .nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-bill-tab') === tab);
            });
            if(tab === 'record') initBillModule();
            if(tab === 'history') renderBillCalendarAndList();
            if(tab === 'stats') initBillStatsView();
        }

        function renderBillCalendarAndList() {
            const container = document.getElementById('bill-calendar-container');
            if(!container) return;
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let recordedDates = new Set(db.bills.map(b => b.date));

            let html = `<div class="calendar-grid">
                <div class="cal-header">一</div><div class="cal-header">二</div><div class="cal-header">三</div><div class="cal-header">四</div><div class="cal-header">五</div><div class="cal-header">六</div><div class="cal-header">日</div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const mStr = (month + 1).toString().padStart(2, '0');
                const dStr = d.toString().padStart(2, '0');
                const dateKey = `${year}-${mStr}-${dStr}`;
                const hasRec = recordedDates.has(dateKey);
                const isSel = selectedBillDate === dateKey;

                html += `<div class="cal-day ${hasRec ? 'has-record' : ''} ${isSel ? 'selected' : ''}" data-bill-date="${dateKey}">${d}</div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
            renderBillListForDate(selectedBillDate);
        }

        function renderBillListForDate(dateStr) {
            const listCont = document.getElementById('bill-history-list');
            const banner = document.getElementById('bill-day-total-banner');
            if(!listCont || !banner) return;

            const matched = db.bills.map((b, idx) => ({...b, origIdx: idx})).filter(b => b.date === dateStr);
            
            let dayTotal = 0;
            matched.forEach(b => dayTotal += b.amount);

            const [pYear, pMonth, pDay] = dateStr.split('-');
            banner.innerText = `${pYear}年${parseInt(pMonth)}月${parseInt(pDay)}日总消费金额：${dayTotal.toFixed(2)}元`;

            if(matched.length === 0) {
                listCont.innerHTML = `<div style="color:var(--text-sub); text-align:center; padding:15px;">${dateStr} 暂无账单记录</div>`;
                return;
            }
            let html = '';
            matched.forEach((b, idx) => {
                const isLatest = (idx === matched.length - 1);
                html = formatBillItemHTML(b, b.origIdx, isLatest) + html;
            });
            listCont.innerHTML = html;
        }

        function initBillStatsView() {
            const yearSelect = document.getElementById('stat-year-select');
            const monthSelect = document.getElementById('stat-month-select');
            const currentYear = new Date().getFullYear();
            const currentMonth = (new Date().getMonth() + 1).toString().padStart(2, '0');

            let yearHtml = '';
            for(let y = currentYear; y >= currentYear - 3; y--) {
                yearHtml += `<option value="${y}">${y}年</option>`;
            }
            yearSelect.innerHTML = yearHtml;
            yearSelect.value = currentYear.toString();
            monthSelect.value = currentMonth;

            renderBillStats();
        }

        function renderBillStats() {
            const yearVal = document.getElementById('stat-year-select').value;
            const monthVal = document.getElementById('stat-month-select').value;
            const today = new Date().toISOString().split('T')[0];

            let periodTotal = 0;
            let todayTotal = 0;
            let filteredBills = [];

            db.bills.forEach(b => {
                if(b.date === today) todayTotal += b.amount;

                const [bYear, bMonth] = b.date.split('-');
                if(bYear === yearVal) {
                    if(monthVal === 'all' || bMonth === monthVal) {
                        periodTotal += b.amount;
                        filteredBills.push(b);
                    }
                }
            });

            document.getElementById('bill-stat-period-title').innerText = monthVal === 'all' ? `${yearVal}年度总消费` : `${yearVal}年${parseInt(monthVal)}月总消费`;
            document.getElementById('bill-stat-period-total').innerText = periodTotal.toFixed(2) + ' 元';
            document.getElementById('bill-stat-today-total').innerText = todayTotal.toFixed(2) + ' 元';

            let catAmount = {}, catCount = {};
            let platAmount = {}, platCount = {};
            let itemAmount = {}, itemCount = {};

            filteredBills.forEach(b => {
                catAmount[b.category] = (catAmount[b.category] || 0) + b.amount;
                catCount[b.category] = (catCount[b.category] || 0) + 1;
                platAmount[b.platform] = (platAmount[b.platform] || 0) + b.amount;
                platCount[b.platform] = (platCount[b.platform] || 0) + 1;
                itemAmount[b.item] = (itemAmount[b.item] || 0) + b.amount;
                itemCount[b.item] = (itemCount[b.item] || 0) + 1;
            });

            function getTop(obj, isCount = false) {
                let keys = Object.keys(obj);
                if(keys.length === 0) return '暂无数据';
                keys.sort((a, b) => obj[b] - obj[a]);
                return `${keys[0]} (${isCount ? obj[keys[0]] + '次' : '¥' + obj[keys[0]].toFixed(2)})`;
            }

            const rankHTML = `
                <div class="card-title" style="font-size:14px; margin-bottom:10px;">消费排行分析</div>
                <div style="font-size:13px; color:var(--text-sub); display:flex; flex-direction:column; gap:6px;">
                    <div>金额最高品类: <span style="color:var(--text-main);">${getTop(catAmount)}</span></div>
                    <div>次数最多品类: <span style="color:var(--text-main);">${getTop(catCount, true)}</span></div>
                    <div>花费最高平台: <span style="color:var(--text-main);">${getTop(platAmount)}</span></div>
                    <div>次数最多平台: <span style="color:var(--text-main);">${getTop(platCount, true)}</span></div>
                    <div>金额最高品名: <span style="color:var(--text-main);">${getTop(itemAmount)}</span></div>
                    <div>次数最多品名: <span style="color:var(--text-main);">${getTop(itemCount, true)}</span></div>
                </div>
            `;
            document.getElementById('bill-stat-rankings').innerHTML = rankHTML;
        }

        /* 个人信息模块逻辑 */
        function initProfileModule() {
            const container = document.getElementById('profile-cards-container');
            if(!container) return;
            let html = '';
            db.profiles.forEach(p => {
                html += `
                    <div class="card" data-profile-key="${p.id}">
                        <div>
                            <div class="card-title">${p.title}</div>
                            <div style="font-size: 20px; font-weight: 600; margin: 10px 0;">${p.value}</div>
                            <div class="card-desc">更新于 ${p.updateTime}</div>
                        </div>
                    </div>
                `;
            });
            html += `
                <div class="card" id="add-profile-trigger" style="border: 2px dashed var(--card-border); align-items: center; justify-content: center;">
                    <div style="text-align:center; color: var(--text-sub);">+ 添加信息</div>
                </div>
            `;
            container.innerHTML = html;
        }

        /* 触摸滑动交互逻辑 */
        let touchStartX = 0;
        let currentSwipeWrapper = null;

        document.body.addEventListener('touchstart', function(e) {
            const wrapper = e.target.closest('[data-swipe-wrapper]');
            if(wrapper) {
                touchStartX = e.touches[0].clientX;
                if(currentSwipeWrapper && currentSwipeWrapper !== wrapper) {
                    currentSwipeWrapper.classList.remove('swiped');
                }
                currentSwipeWrapper = wrapper;
            } else {
                if(currentSwipeWrapper) {
                    currentSwipeWrapper.classList.remove('swiped');
                    currentSwipeWrapper = null;
                }
            }
        }, {passive: true});

        document.body.addEventListener('touchend', function(e) {
            if(!currentSwipeWrapper) return;
            const touchEndX = e.changedTouches[0].clientX;
            const diffX = touchEndX - touchStartX;
            if(diffX < -40) {
                currentSwipeWrapper.classList.add('swiped');
            } else if(diffX > 40) {
                currentSwipeWrapper.classList.remove('swiped');
            }
        }, {passive: true});

        /* 统一交互监听 */
        document.body.addEventListener('click', function(e) {
            if(e.target.classList.contains('nav-home')) {
                switchModule('home');
                return;
            }

            const sTab = e.target.closest('[data-sleep-tab]');
            if(sTab) {
                switchSleepTab(sTab.getAttribute('data-sleep-tab'));
                return;
            }

            const bTab = e.target.closest('[data-bill-tab]');
            if(bTab) {
                switchBillTab(bTab.getAttribute('data-bill-tab'));
                return;
            }

            if(e.target.id === 'sleep-btn') {
                toggleSleep();
                return;
            }

            const sDay = e.target.closest('[data-sleep-date]');
            if(sDay) {
                selectedSleepDate = sDay.getAttribute('data-sleep-date');
                renderSleepCalendarAndList();
                return;
            }

            const bDay = e.target.closest('[data-bill-date]');
            if(bDay) {
                selectedBillDate = bDay.getAttribute('data-bill-date');
                renderBillCalendarAndList();
                return;
            }

            const tag = e.target.closest('[data-tag-type]');
            if(tag) {
                selectedTag[tag.getAttribute('data-tag-type')] = tag.getAttribute('data-tag-val');
                renderTags(tag.getAttribute('data-tag-type'));
                return;
            }

            const addTag = e.target.closest('[data-add-tag]');
            if(addTag) {
                const type = addTag.getAttribute('data-add-tag');
                const name = prompt('请输入新选项名称：');
                if(name && name.trim()) {
                    db.options[type].push(name.trim());
                    saveDB();
                    renderTags(type);
                }
                return;
            }

            if(e.target.id === 'save-bill-btn') {
                addBill();
                return;
            }

            const pCard = e.target.closest('[data-profile-key]');
            if(pCard) {
                const id = pCard.getAttribute('data-profile-key');
                const profile = db.profiles.find(p => p.id === id);
                if(profile) {
                    const newVal = prompt(`修改 ${profile.title}：`, profile.value);
                    if(newVal !== null) {
                        profile.value = newVal;
                        profile.updateTime = `${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日`;
                        saveDB();
                        initProfileModule();
                    }
                }
                return;
            }

            if(e.target.id === 'add-profile-trigger' || e.target.closest('#add-profile-trigger')) {
                const title = prompt('请输入新信息名称（例如：视力、血压）：');
                if(title) {
                    const val = prompt('请输入对应数值：');
                    if(val) {
                        db.profiles.push({
                            id: 'custom_' + Date.now(),
                            title: title,
                            value: val,
                            updateTime: `${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日`
                        });
                        saveDB();
                        initProfileModule();
                    }
                }
                return;
            }

            const delSleep = e.target.closest('[data-del-sleep]');
            if(delSleep) {
                const idx = parseInt(delSleep.getAttribute('data-del-sleep'));
                db.sleeps.splice(idx, 1);
                saveDB();
                renderSleepCalendarAndList();
                renderTodaySleepList();
                return;
            }

            const delBill = e.target.closest('[data-del-bill]');
            if(delBill) {
                const idx = parseInt(delBill.getAttribute('data-del-bill'));
                db.bills.splice(idx, 1);
                saveDB();
                renderBillCalendarAndList();
                renderTodayBillList();
                calcTodayTotal();
                return;
            }

            if(e.target.id === 'open-data-modal') {
                document.getElementById('data-modal').style.display = 'flex';
                return;
            }
            if(e.target.id === 'close-data-modal') {
                document.getElementById('data-modal').style.display = 'none';
                return;
            }
            if(e.target.id === 'export-json-btn') {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
                const dlAnchor = document.createElement('a');
                dlAnchor.setAttribute("href", dataStr);
                dlAnchor.setAttribute("download", `ming_toolbox_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(dlAnchor);
                dlAnchor.click();
                dlAnchor.remove();
                return;
            }
            if(e.target.id === 'trigger-import-btn') {
                document.getElementById('import-file').click();
                return;
            }
        });

        document.body.addEventListener('change', function(e) {
            if(e.target.id === 'stat-month-select' || e.target.id === 'stat-year-select') {
                renderBillStats();
            }
            if(e.target.id === 'sleep-stat-month-select' || e.target.id === 'sleep-stat-year-select') {
                renderSleepStats();
            }
            if(e.target.id === 'import-file') {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    if(confirm('确认后将完全替换当前整站数据，是否继续？')) {
                        try {
                            db = JSON.parse(evt.target.result);
                            saveDB();
                            alert('数据导入成功！');
                            location.reload();
                        } catch(err) {
                            alert('文件格式错误，导入失败！');
                        }
                    }
                };
                reader.readAsText(file);
            }
        });
    });
</script>
</body>
