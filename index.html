<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ming工具箱</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 480px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; display: flex; flex-direction: column; padding-bottom: 90px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        h1 { font-size: 22px; font-weight: 600; }
        .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; min-height: 80px; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.08); }
        .card-title { font-size: 16px; font-weight: 500; margin-bottom: 8px; pointer-events: none; }
        .card-desc { font-size: 12px; color: var(--text-sub); pointer-events: none; }
        .data-btn { position: fixed; right: 20px; bottom: 80px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); cursor: pointer; border: none; z-index: 100; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-content { background: #121824; border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; width: 100%; max-width: 360px; }
        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .btn-primary { width: 100%; padding: 12px; border-radius: 12px; background: var(--accent-gradient); color: white; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: var(--card-bg); color: var(--text-sub); flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>Ming工具箱</h1></header>
    <div class="grid-cards">
        <div class="card" onclick="location.href='作息记录.html'">
            <div><div class="card-title">作息记录</div><div class="card-desc">睡眠监测与时长统计</div></div>
        </div>
        <div class="card" onclick="location.href='账单记录.html'">
            <div><div class="card-title">账单记录</div><div class="card-desc">消费明细与智能排行</div></div>
        </div>
        <div class="card" onclick="location.href='个人信息.html'">
            <div><div class="card-title">个人信息</div><div class="card-desc">身高体重健康数据</div></div>
        </div>
        <div class="card" style="opacity: 0.5;">
            <div><div class="card-title">预留扩展</div><div class="card-desc">敬请期待新工具</div></div>
        </div>
    </div>
</div>
<button class="data-btn" id="open-data-modal">数据</button>
<div class="modal" id="data-modal">
    <div class="modal-content">
        <div class="modal-title">数据管理</div>
        <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 16px;">支持导出全部整站数据为 JSON 文件，或导入外部备份文件。</p>
        <button class="btn-primary" id="export-json-btn" style="margin-bottom: 10px;">导出整站数据</button>
        <button class="btn-primary" id="trigger-import-btn" style="background:var(--card-bg); border:1px solid var(--card-border);">导入整站数据</button>
        <input type="file" id="import-file" style="display:none" accept=".json">
        <div class="modal-btns"><button class="btn-cancel" id="close-data-modal">关闭</button></div>
    </div>
</div>
<script>
    document.getElementById('open-data-modal').onclick = () => document.getElementById('data-modal').style.display = 'flex';
    document.getElementById('close-data-modal').onclick = () => document.getElementById('data-modal').style.display = 'none';
    document.getElementById('export-json-btn').onclick = () => {
        const data = localStorage.getItem('ming_toolbox_data') || '{}';
        const blob = new Blob([data], {type: 'text/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'ming_toolbox_backup.json'; a.click();
    };
    document.getElementById('trigger-import-btn').onclick = () => document.getElementById('import-file').click();
    document.getElementById('import-file').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            if(confirm('确认覆盖当前所有数据？')) {
                localStorage.setItem('ming_toolbox_data', evt.target.result);
                alert('导入成功！'); location.reload();
            }
        };
        reader.readAsText(file);
    };
</script>
</body>
</html>
