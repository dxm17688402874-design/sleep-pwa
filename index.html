<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d22"><meta name="description" content="离线睡眠记录"><title>作息记录</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head><body><div class="app-shell">
<header class="app-header"><div class="brand-mark">☾</div><div class="brand-copy"><h1 id="page-heading">作息记录</h1><p id="page-subtitle">好好睡觉，是一种生活态度</p></div><span class="offline-pill"><i></i>离线可用</span></header>
<main>
<section class="page active" id="page-home" data-page="home"><div class="home-scene"><div class="scene-stars"></div><div class="scene-moon"></div><div class="mountain back"></div><div class="mountain front"></div><div class="lake"></div></div><div class="sleep-orb-wrap"><button id="sleep-toggle" class="sleep-orb"><span class="orb-moon">☾<i>✦</i></span><span class="orb-label" id="sleep-toggle-label">开睡</span></button></div><p class="home-hint" id="home-hint">点击开始记录今晚的睡眠</p><div class="sleep-status-card"><div class="status-moon">☾<small>✦</small></div><div><strong id="status-title">今晚还没有睡眠记录</strong><p id="status-description">愿你今晚睡个好觉</p></div><span class="sprig">✧</span></div><div class="recent-mini" id="home-recent" hidden></div></section>
<section class="page" id="page-history" data-page="history" hidden><div class="section-heading"><div><h2>历史</h2><p>记录每一个安稳的夜晚</p></div><span class="heading-icon">▦</span></div><div class="month-picker"><button id="prev-year">«</button><button id="prev-month">‹</button><strong id="month-label"></strong><button id="next-month">›</button><button id="next-year">»</button></div><div class="calendar"><div class="weekday-row"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div class="calendar-grid" id="calendar-grid"></div></div><div class="history-list-card"><div class="selected-date-heading"><div><h3 id="selected-date-title">选择日期</h3><p id="selected-date-subtitle">该日期的睡眠记录</p></div><span class="selected-date-dot"></span></div><div id="selected-records" class="record-list"></div></div></section>
<section class="page" id="page-stats" data-page="stats" hidden><div class="section-heading"><div><h2>统计分析</h2><p>了解睡眠，遇见更好的自己</p></div><span class="heading-icon">▥</span></div><div class="period-switch"><button class="period-button active" data-period="month">按月</button><button class="period-button" data-period="year">按年</button></div><div class="stat-card"><div class="stat-icon moon-icon">☾</div><div><p id="total-label">本月睡眠总时长</p><strong id="total-value">0 <small>小时</small> 0 <small>分钟</small></strong></div></div><div class="stat-card"><div class="stat-icon clock-icon">◴</div><div><p>平均每天睡眠时长</p><strong id="average-value">0 <small>小时</small> 0 <small>分钟</small></strong></div></div><div class="distribution-card"><h3>开始睡觉的时间分布</h3><p class="distribution-subtitle">按开始睡觉的时间统计次数</p><div id="time-distribution" class="distribution-list"></div><p class="sample-note" id="stats-empty-note" hidden>记录更多睡眠后，这里会显示你的入睡时间规律。</p></div></section>
</main><button id="export-button" class="export-fab" title="导出记录"><span>⇧</span><small>导出</small></button><input id="import-file" type="file" accept="application/json,.json" hidden><nav class="bottom-nav"><button class="nav-button active" data-page="home"><span class="nav-icon">⌂</span><span>首页</span></button><button class="nav-button" data-page="history"><span class="nav-icon">▦</span><span>历史</span></button><button class="nav-button" data-page="stats"><span class="nav-icon">▥</span><span>统计</span></button></nav></div><div id="toast" class="toast" role="status"></div><script src="./app.js"></script></body></html>
